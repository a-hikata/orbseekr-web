name: Deploy

# Publishes the static build to GitHub Pages at https://www.orbseekr.jp.
#
# The production origin and base path are NOT set here. They are the defaults
# in astro.config.mjs — SITE_URL=https://www.orbseekr.jp, BASE_PATH=/ — which
# is the single source of truth for the site's identity. Repeating them here
# would create a second place that has to agree.
#
# Overriding SITE_URL / BASE_PATH is what produces a *staging* build, and a
# staging build must never be what this workflow publishes: served from the
# custom domain, its assets resolve under the project subpath and 404, its
# canonical points at github.io, and its robots policy is noindex.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify before publishing
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:unit

      # No SITE_URL / BASE_PATH: the astro.config.mjs defaults are production.
      - run: npm run build

      - name: Refuse to publish a staging build
        run: node scripts/assert-production-build.mjs

      # actions/upload-pages-artifact v4.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v4.0.5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
